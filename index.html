<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroCopy</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: white; /* pure white brand background */
    }

    h2 {
        margin: 0 0 12px 0;
        text-align: left;
    }

    #inputBox {
        width: 100%;
        padding: 12px 20px; /* right padding fixed */
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
        box-sizing: border-box;
        margin-bottom: 16px;
        text-align: left;
    }

    button {
        padding: 10px 18px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        background: #0078ff;
        color: white;
        cursor: pointer;
        display: inline-block; /* button only as wide as its text */
        text-align: left;
    }

    button:active {
        opacity: 0.85;
    }
</style>
</head>
<body>

<h2>MicroCopy</h2>

<textarea id="inputBox" rows="4" placeholder="Type or paste text here..."></textarea>

<button onclick="copyText()">Copy to Clipboard</button>

<script>
function copyText() {
    const box = document.getElementById("inputBox");
    const text = box.value;
    navigator.clipboard.writeText(text);
}
</script>

</body>
</html>
