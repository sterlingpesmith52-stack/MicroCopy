<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroCopy</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: white; /* pure white brand background */
    }

    .header-row {
        display: flex;
        flex-direction: column; /* logo above title */
        align-items: flex-start; /* left aligned */
        margin-bottom: 20px;
    }

    .logo {
        width: 96px;      /* enlarged logo */
        height: auto;
        margin-bottom: 8px; /* spacing between logo and title */
    }

    .title {
        font-size: 22px;
        font-weight: 600;
        text-align: left;
    }

    #inputBox {
        width: 100%;
        padding: 12px 20px;
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
        box-sizing: border-box;
        margin-bottom: 16px;
        text-align: left;
        resize: none;
    }

    button {
        padding: 10px 18px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        background: #0078ff;
        color: white;
        cursor: pointer;
        display: inline-block;
        text-align: left;
    }

    button:active {
        opacity: 0.85;
    }
</style>
</head>

<body>

<div class="header-row">
    <img src="./IMG_1741.jpeg" class="logo" alt="MicroFoundary Logo">
    <div class="title">MicroCopy</div>
</div>

<textarea id="inputBox" rows="6" placeholder="Type or paste text here..."></textarea>

<button onclick="copyText()">Copy to Clipboard</button>

<script>
function copyText() {
    const box = document.getElementById("inputBox");

    /* iPhone Chrome-safe copy method */
    box.select();
    document.execCommand("copy");
}
</script>

</body>
</html>
